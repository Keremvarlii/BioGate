<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioGate - Kullanıcı Yönetimi</title>
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/adminGuard.js"></script>
</head>

<body>
    <div class="admin-layout">
        <!-- Sol Menü -->
        <aside class="sidebar">
            <div class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 22H22L12 2Z" fill="#ffffff" />
                </svg>
                <span>BioGate Admin</span>
            </div>
            <nav class="nav-menu">
                <a href="adminAnaSayfa.html" class="nav-item">Canlı Loglar</a>
                <a href="kullaniciYonetimi.html" class="nav-item active">Kullanıcı Yönetimi</a>
                <a href="guvenlikAyarlari.html" class="nav-item">Güvenlik Ayarları</a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn">Çıkış Yap</button>
            </div>
        </aside>

        <!-- Ana İçerik -->
        <main class="main-content">
            <header class="top-header">
                <h2>Kullanıcı Yönetimi</h2>
            </header>

            <!-- Yeni Kullanıcı Ekleme Formu -->
            <div class="admin-card mb-24">
                <h3 class="card-title">Yeni Yetkili Ekle</h3>
                <form class="admin-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ad Soyad</label>
                            <input type="text" placeholder="Örn: Bekir Yılmaz">
                        </div>
                        <div class="form-group">
                            <label>E-Posta Adresi (OTP Gönderimi İçin)</label>
                            <input type="email" placeholder="ornek@sirket.com">
                        </div>
                        <div class="form-group">
                            <label>Yetki Rolü</label>
                            <select>
                                <option>Standart Geçiş</option>
                                <option>Sistem Yöneticisi (Admin)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary">Kameradan Yüz Tara</button>
                        <button type="submit" class="btn-primary">Kullanıcıyı Kaydet</button>
                    </div>
                </form>
            </div>

            <!-- Kullanıcı Listesi -->
            <div class="table-container">
                <div class="table-header">
                    <h3>Kayıtlı Personel Listesi</h3>
                </div>
                <table class="log-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Ad Soyad</th>
                            <th>E-Posta</th>
                            <th>Rol</th>
                            <th>Durum</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#001</td>
                            <td>Abdül Kerem Varlı</td>
                            <td>kerem@sirket.com</td>
                            <td>Sistem Yöneticisi</td>
                            <td><span class="badge badge-success">Aktif</span></td>
                            <td>
                                <button class="action-btn text-warning">Askıya Al</button>
                                <button class="action-btn text-danger">Sil</button>
                            </td>
                        </tr>
                        <tr>
                            <td>#002</td>
                            <td>Bekir</td>
                            <td>bekir@sirket.com</td>
                            <td>Standart Geçiş</td>
                            <td><span class="badge badge-success">Aktif</span></td>
                            <td>
                                <button class="action-btn text-warning">Askıya Al</button>
                                <button class="action-btn text-danger">Sil</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>

</html>
